# SRM Credit Engine - base configuration (profile "default" = local development).
# Profiles: default (local), docker (container runtime), demo (large demo dataset), test (automated tests).
spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${DB_USER:srm}
    password: ${DB_PASSWORD:srm}
    hikari:
      pool-name: srm-hikari
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Entities are never lazily loaded from the web layer; services return fully initialized data.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  web:
    # User-facing messages (problem details, bean validation) are in Portuguese regardless of Accept-Language.
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      # No authentication in this challenge: in production the actuator port stays on the internal network.
      show-details: always
      probes:
        enabled: true
      group:
        # Liveness never depends on external systems (a restart would not fix them).
        liveness:
          include: livenessState
        # Ready = able to serve requests, which needs the database; the FX provider is deliberately
        # excluded: pricing keeps working on the last persisted rate while Frankfurter is down.
        readiness:
          include: readinessState,db
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Plataforma de cessão de crédito multimoedas (FIDC)

srm:
  business:
    # Business dates (operation date, report periods) are evaluated in this zone; instants stay UTC.
    zone-id: America/Sao_Paulo
  fx:
    # Cross-currency pricing refuses rates older than this (counted from the start of their reference date).
    max-rate-age: P5D
    frankfurter:
      base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev/v1}
      connect-timeout: 2s
      read-timeout: 3s
    sync:
      # Pull USD/BRL from Frankfurter on startup and hourly (enabled in the docker/demo profiles).
      enabled: ${FX_SYNC_ENABLED:false}
      cron: "0 5 * * * *"
      base: USD
      quotes: BRL
  pricing:
    # Longest accepted term between the operation date and the due date (5 years).
    max-term-days: 1825
    # Monthly base rate (funding cost) per face currency.
    base-rates:
      BRL: "0.01"
      USD: "0.005"
    # Monthly risk spread of each receivable type (one PricingStrategy per type).
    spreads:
      duplicata-mercantil: "0.015"
      cheque-pre-datado: "0.025"

  settlement:
    # Optimistic locking conflicts on the shared cash account are retried around the whole transaction.
    retry:
      max-retries: 5
      delay: 50ms
      jitter: 25ms
      multiplier: 2
      max-delay: 1s

# Resilience of the Frankfurter call. Retry wraps the circuit breaker, so each attempt counts as a call.
resilience4j:
  retry:
    instances:
      frankfurter:
        max-attempts: 3
        wait-duration: 500ms
        # 500ms, ~1s (+/- 50% jitter) between attempts
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 4s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Only transient failures are retried: I/O errors/timeouts and 5xx. 4xx and unreadable payloads are not.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      frankfurter:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2
        # A 4xx means our request is wrong, not that the provider is unhealthy.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
        # Shown in /actuator/health, but an open circuit must not turn the application DOWN.
        register-health-indicator: true
        allow-health-indicator-to-fail: false
---
# Container runtime (docker compose): the provider is reachable, keep rates fresh automatically.
spring:
  config:
    activate:
      on-profile: docker
srm:
  fx:
    sync:
      enabled: ${FX_SYNC_ENABLED:true}
---
# Demo: loads a large deterministic dataset (db/demo) for the statement report; combinable with docker.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # the demo migration (V1000) may precede future schema migrations on an existing demo database
    out-of-order: true
srm:
  fx:
    sync:
      enabled: ${FX_SYNC_ENABLED:true}
---
spring:
  config:
    activate:
      on-profile: test
srm:
  fx:
    frankfurter:
      # Tests point base-url to WireMock; short timeouts keep the timeout scenarios fast.
      connect-timeout: 500ms
      read-timeout: 1s
    sync:
      # never call the real provider (nor wait for it) in tests
      enabled: false
resilience4j:
  retry:
    instances:
      frankfurter:
        wait-duration: 10ms
        exponential-max-wait-duration: 50ms
