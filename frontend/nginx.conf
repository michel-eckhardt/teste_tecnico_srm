# SPA server for the SRM Credit Engine operator panel.
# Rendered by the nginx image entrypoint (envsubst) from /etc/nginx/templates: only the variables
# defined in the environment (API_UPSTREAM, NGINX_RESOLVER) are replaced; nginx variables stay.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # --- security headers (inherited by every location that does not call add_header) -----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Everything is same-origin (the API is proxied below). Mantine injects runtime style
    # attributes, hence 'unsafe-inline' for styles only; scripts are strictly 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- compression ---------------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API: same-origin reverse proxy to the backend -------------------------------------------------
    # Resolved at request time (variable + resolver), so the SPA starts even before the backend.
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # --- static files -----------------------------------------------------------------------------------
    # Vite content-hashes every file under /assets: cache them "forever".
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes fall back to index.html, which is always revalidated (new deployments).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
