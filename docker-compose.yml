# SRM Credit Engine - full local stack.
#
#   docker compose up --build -d
#
#   SPA (operator panel) ..... http://localhost:3000
#   API + Swagger UI ......... http://localhost:8080/swagger-ui.html
#   Prometheus ............... http://localhost:9090
#   Grafana .................. http://localhost:3001   (dashboard "SRM Credit Engine")
#
# PostgreSQL is not published on the host on purpose (only the API reaches it); inspect it with
#   docker compose exec postgres psql -U srm -d srm_credit_engine
#
# Every value below can be overridden through the shell or a .env file (see .env.example).

name: srm-credit-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-srm_credit_engine}
      POSTGRES_USER: ${DB_USER:-srm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: srm-credit-engine-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # docker: ECS JSON logs + scheduled Frankfurter sync; demo: ~100k operations for the statement.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,demo}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-srm_credit_engine}
      DB_USER: ${DB_USER:-srm}
      DB_PASSWORD: ${DB_PASSWORD:-srm}
      FX_SYNC_ENABLED: ${FX_SYNC_ENABLED:-true}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev/v1}
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: srm-credit-engine-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only anonymous access so the dashboard opens without a login during the evaluation.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/srm-credit-engine.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
