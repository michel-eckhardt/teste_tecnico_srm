version: 2

# Minor and patch updates only. Major versions are upgraded deliberately: several of them change the
# runtime baseline (Java 21 and Node 22 are the LTS versions this project targets; e.g. lint-staged 17,
# jsdom 30 and React Router 8 require Node >= 22.22) or the public API of a library.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # eclipse-temurin 21 and node 22 are the LTS runtimes; only their patch images are tracked
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
